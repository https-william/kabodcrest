<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 280" width="100%" height="100%" fill="none" role="img" aria-label="Kabod Crest Farm-to-Pouch Controlled Dehydration Process Diagram">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&amp;family=Inter:wght@400;500;600&amp;family=Montserrat:wght@600;700&amp;display=swap');
      .diag-bg { fill: #0B0B0B; rx: 16px; }
      .card-bg { fill: #17111D; stroke: rgba(200, 164, 93, 0.28); stroke-width: 1; rx: 12px; }
      .card-bg-active { fill: #221430; stroke: #C8A45D; stroke-width: 1.5; rx: 12px; }
      .step-num { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; fill: #C8A45D; letter-spacing: 0.12em; }
      .step-title { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 700; fill: #FAF7F2; }
      .step-desc { font-family: 'Inter', sans-serif; font-size: 11.5px; fill: #D6CFBF; line-height: 1.45; }
      .step-metric { font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 600; fill: #C8A45D; }
      .arrow-line { stroke: rgba(200, 164, 93, 0.4); stroke-width: 2; stroke-dasharray: 4 4; }
      .arrow-head { fill: #C8A45D; }
      .diag-tagline { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 14px; font-style: italic; fill: #D6CFBF; text-anchor: end; }
      .diag-header { font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; fill: #C8A45D; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Canvas Outer Container -->
  <rect width="1140" height="280" class="diag-bg" />
  <rect x="1" y="1" width="1138" height="278" rx="15" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Diagram Header Bar -->
  <text x="32" y="38" class="diag-header">The Controlled Dehydration Standard</text>
  <text x="1108" y="38" class="diag-tagline">“Preserving nature's cellular vitality without synthetic additives.”</text>
  <line x1="32" y1="52" x2="1108" y2="52" stroke="rgba(184, 177, 165, 0.18)" stroke-width="1" />

  <!-- STEP 1 -->
  <g transform="translate(32, 70)">
    <rect width="245" height="180" class="card-bg" />
    <circle cx="28" cy="28" r="14" fill="#321A4A" stroke="rgba(200,164,93,0.3)" />
    <text x="28" y="32" text-anchor="middle" class="step-num">01</text>
    <text x="52" y="32" class="step-title">Dawn Farm Harvest</text>
    <text x="18" y="70" class="step-desc">
      <tspan x="18" dy="0">Hand-selected at dawn across</tspan>
      <tspan x="18" dy="18">partner farms in Enugu &amp; Kaduna.</tspan>
      <tspan x="18" dy="18">Picked at optimal dew point to</tspan>
      <tspan x="18" dy="18">retain rich natural chlorophyll.</tspan>
    </text>
    <rect x="18" y="146" width="209" height="22" rx="4" fill="rgba(200, 164, 93, 0.1)" />
    <text x="26" y="161" class="step-metric">ORIGIN: ENUGU &amp; KADUNA</text>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <line x1="282" y1="160" x2="310" y2="160" class="arrow-line" />
  <polygon points="310,156 318,160 310,164" class="arrow-head" />

  <!-- STEP 2 -->
  <g transform="translate(320, 70)">
    <rect width="245" height="180" class="card-bg" />
    <circle cx="28" cy="28" r="14" fill="#321A4A" stroke="rgba(200,164,93,0.3)" />
    <text x="28" y="32" text-anchor="middle" class="step-num">02</text>
    <text x="52" y="32" class="step-title">Ozone Sanitization</text>
    <text x="18" y="70" class="step-desc">
      <tspan x="18" dy="0">Multi-stage cold aqueous ozone wash</tspan>
      <tspan x="18" dy="18">cleanses soil micro-particulates</tspan>
      <tspan x="18" dy="18">and airborne flora with zero</tspan>
      <tspan x="18" dy="18">chemical or chlorine residues.</tspan>
    </text>
    <rect x="18" y="146" width="209" height="22" rx="4" fill="rgba(200, 164, 93, 0.1)" />
    <text x="26" y="161" class="step-metric">PURITY: 100% NON-CHEMICAL</text>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <line x1="570" y1="160" x2="598" y2="160" class="arrow-line" />
  <polygon points="598,156 606,160 598,164" class="arrow-head" />

  <!-- STEP 3 (ACTIVE HERO STAGE) -->
  <g transform="translate(608, 70)">
    <rect width="245" height="180" class="card-bg-active" />
    <circle cx="28" cy="28" r="14" fill="#C8A45D" />
    <text x="28" y="32" text-anchor="middle" style="font-family:'Montserrat'; font-size:11px; font-weight:700; fill:#0B0B0B;">03</text>
    <text x="52" y="32" class="step-title" fill="#C8A45D">Tunnel Dehydration</text>
    <text x="18" y="70" class="step-desc">
      <tspan x="18" dy="0">Gentle airflow drying at 42°C–48°C.</tspan>
      <tspan x="18" dy="18">Removes cellular moisture without</tspan>
      <tspan x="18" dy="18">cooking or scorching leaves,</tspan>
      <tspan x="18" dy="18">locking in taste and phytonutrients.</tspan>
    </text>
    <rect x="18" y="146" width="209" height="22" rx="4" fill="#321A4A" stroke="rgba(200, 164, 93, 0.4)" />
    <text x="26" y="161" class="step-metric" fill="#FAF7F2">TEMP CONTROL: 42°C – 48°C</text>
  </g>

  <!-- CONNECTOR 3 -> 4 -->
  <line x1="858" y1="160" x2="886" y2="160" class="arrow-line" />
  <polygon points="886,156 894,160 886,164" class="arrow-head" />

  <!-- STEP 4 -->
  <g transform="translate(896, 70)">
    <rect width="212" height="180" class="card-bg" />
    <circle cx="28" cy="28" r="14" fill="#321A4A" stroke="rgba(200,164,93,0.3)" />
    <text x="28" y="32" text-anchor="middle" class="step-num">04</text>
    <text x="52" y="32" class="step-title">Barrier Sealing</text>
    <text x="18" y="70" class="step-desc">
      <tspan x="18" dy="0">Nitrogen-flushed multi-layer</tspan>
      <tspan x="18" dy="18">foil pouching sealing under</tspan>
      <tspan x="18" dy="18">&lt; 7% residual humidity.</tspan>
      <tspan x="18" dy="18">Guarantees 18-mo stability.</tspan>
    </text>
    <rect x="18" y="146" width="176" height="22" rx="4" fill="rgba(200, 164, 93, 0.1)" />
    <text x="24" y="161" class="step-metric">SHELF LIFE: 18 MONTHS</text>
  </g>
</svg>
